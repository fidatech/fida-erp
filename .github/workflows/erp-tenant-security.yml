name: FidaERP Tenant Security Baseline

on:
  pull_request:
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'routes/**'
      - 'tests/**'
      - '.github/workflows/erp-tenant-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tenant-security-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_mysql, intl, gd, bcmath
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Syntax check security tests
        run: |
          php -l tests/Feature/ERP/TenantSecurityBaselineTest.php
          php -l tests/Feature/ERP/TenantIsolationIntegrationTest.php
      - name: Execute baseline security tests
        run: php artisan test --filter TenantSecurityBaselineTest --stop-on-failure
      - name: Report integration gate
        run: echo 'MySQL two-tenant integration test remains INCOMPLETE and is not claimed as passed.'
